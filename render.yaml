# Blueprint Render (Infrastructure as Code) pour deployer PNDFE en un clic.
# Usage : sur render.com, "New +" -> "Blueprint" -> connecter ce depot Git.
# Voir DEPLOIEMENT.md pour le guide pas-a-pas complet.
#
# Architecture : un seul service web sert a la fois l'API et le frontend
# (build statique React copie dans l'image au moment du build - voir
# Dockerfile a la racine du depot). Choix fait pour rester sur 2 ressources
# gratuites au total (1 service + 1 base) plutot que 3, certains comptes
# Render limitant le nombre de ressources gratuites simultanees.
#
# Hypothese de nom de service : l'URL publique suivra le schema
# https://pndfe-backend.onrender.com. Si ce nom est deja pris, Render en
# choisit un autre proche - dans ce cas, mettre a jour PUBLIC_APP_URL et
# FRONTEND_URL ci-dessous avec la vraie URL (voir DEPLOIEMENT.md).

databases:
  - name: pndfe-db
    databaseName: pndfe
    user: pndfe
    plan: free

services:
  - type: web
    name: pndfe-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    # NB: le tier gratuit Render ne supporte pas les disques persistants.
    # Consequence : les fichiers uploades (photos, pieces d'identite, PDF
    # generes) sont stockes sur le systeme de fichiers ephemere du conteneur
    # et seront perdus a chaque redeploiement/redemarrage. Deja documente
    # comme limite connue dans RAPPORT_SECURITE.md. Pour un stockage
    # persistant sans passer sur un plan payant, migrer vers un stockage
    # objet (S3-compatible, ex: Cloudflare R2) - non fait ici par souci de
    # rester sur les tiers gratuits pour cette premiere demo.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pndfe-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PORT
        value: "4300"
      - key: UPLOADS_DIR
        value: uploads
      # A ajuster si l'URL reelle du service differe (voir DEPLOIEMENT.md) :
      - key: PUBLIC_APP_URL
        value: https://pndfe-backend.onrender.com
      - key: FRONTEND_URL
        value: https://pndfe-backend.onrender.com
